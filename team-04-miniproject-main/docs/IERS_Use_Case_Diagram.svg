<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" width="1160" height="820" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #0F172A; }
      .sys-title { font-size: 16px; font-weight: 700; fill: #0F172A; }
      .actor-label { font-size: 13px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .uc-oval { fill: #E0F2FE; stroke: #0369A1; stroke-width: 1.8; }
      .uc-text { font-size: 12.5px; font-weight: 600; fill: #0F172A; text-anchor: middle; dominant-baseline: middle; }
      .assoc { stroke: #334155; stroke-width: 1.5; fill: none; }
      .inc { stroke: #475569; stroke-width: 1.3; stroke-dasharray: 5,4; fill: none; marker-end: url(#arrow-dashed); }
      .stereo { font-size: 10.5px; font-style: italic; fill: #475569; text-anchor: middle; }
      .stick { stroke: #0F172A; stroke-width: 2; fill: none; stroke-linecap: round; }
      .head { fill: #BAE6FD; stroke: #0F172A; stroke-width: 2; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="1160" height="820" fill="#FFFFFF"/>
  <text x="580" y="34" text-anchor="middle" class="title">UML Use Case Diagram — Intelligent Emergency Response System (IERS)</text>

  <!-- System Boundary Box -->
  <rect x="250" y="55" width="660" height="735" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.2"/>
  <text x="580" y="82" text-anchor="middle" class="sys-title">IERS — Spatial Emergency Dispatch &amp; Route Optimisation System</text>

  <!-- ==================== LEFT ACTORS ==================== -->
  <!-- Actor 1: Citizen (y=190) -->
  <g transform="translate(105, 165)">
    <circle cx="0" cy="0" r="14" class="head"/>
    <line x1="0" y1="14" x2="0" y2="54" class="stick"/>
    <line x1="-22" y1="28" x2="22" y2="28" class="stick"/>
    <line x1="0" y1="54" x2="-18" y2="82" class="stick"/>
    <line x1="0" y1="54" x2="18" y2="82" class="stick"/>
    <text x="0" y="102" class="actor-label">Citizen</text>
  </g>

  <!-- Actor 2: Dispatcher (y=460) -->
  <g transform="translate(105, 445)">
    <circle cx="0" cy="0" r="14" class="head"/>
    <line x1="0" y1="14" x2="0" y2="54" class="stick"/>
    <line x1="-22" y1="28" x2="22" y2="28" class="stick"/>
    <line x1="0" y1="54" x2="-18" y2="82" class="stick"/>
    <line x1="0" y1="54" x2="18" y2="82" class="stick"/>
    <text x="0" y="102" class="actor-label">Dispatcher</text>
  </g>

  <!-- ==================== RIGHT ACTORS ==================== -->
  <!-- Actor 3: Ambulance Operator (y=215) -->
  <g transform="translate(1055, 185)">
    <circle cx="0" cy="0" r="14" class="head"/>
    <line x1="0" y1="14" x2="0" y2="54" class="stick"/>
    <line x1="-22" y1="28" x2="22" y2="28" class="stick"/>
    <line x1="0" y1="54" x2="-18" y2="82" class="stick"/>
    <line x1="0" y1="54" x2="18" y2="82" class="stick"/>
    <text x="0" y="102" class="actor-label">Ambulance</text>
    <text x="0" y="118" class="actor-label">Operator</text>
  </g>

  <!-- Actor 4: Hospital Staff (y=470) -->
  <g transform="translate(1055, 445)">
    <circle cx="0" cy="0" r="14" class="head"/>
    <line x1="0" y1="14" x2="0" y2="54" class="stick"/>
    <line x1="-22" y1="28" x2="22" y2="28" class="stick"/>
    <line x1="0" y1="54" x2="-18" y2="82" class="stick"/>
    <line x1="0" y1="54" x2="18" y2="82" class="stick"/>
    <text x="0" y="102" class="actor-label">Hospital Staff</text>
  </g>

  <!-- Actor 5: PostGIS / pgRouting Engine (y=675) -->
  <g transform="translate(1055, 650)">
    <circle cx="0" cy="0" r="14" class="head"/>
    <line x1="0" y1="14" x2="0" y2="54" class="stick"/>
    <line x1="-22" y1="28" x2="22" y2="28" class="stick"/>
    <line x1="0" y1="54" x2="-18" y2="82" class="stick"/>
    <line x1="0" y1="54" x2="18" y2="82" class="stick"/>
    <text x="0" y="102" class="actor-label">PostGIS &amp;</text>
    <text x="0" y="118" class="actor-label">pgRouting Engine</text>
  </g>

  <!-- ==================== USE CASES (OVALS) ==================== -->
  <!-- Column 1 (x=420) -->
  <ellipse cx="420" cy="145" rx="125" ry="27" class="uc-oval"/>
  <text x="420" y="145" class="uc-text">Report Emergency (GPS)</text>

  <ellipse cx="420" cy="220" rx="125" ry="27" class="uc-oval"/>
  <text x="420" y="220" class="uc-text">Track Live Ambulance &amp; ETA</text>

  <ellipse cx="420" cy="295" rx="125" ry="27" class="uc-oval"/>
  <text x="420" y="295" class="uc-text">Submit Complaint / Feedback</text>

  <ellipse cx="420" cy="390" rx="125" ry="27" class="uc-oval"/>
  <text x="420" y="390" class="uc-text">Monitor Live PyQGIS Map</text>

  <ellipse cx="420" cy="465" rx="125" ry="27" class="uc-oval"/>
  <text x="420" y="465" class="uc-text">Compare Constraint Routes</text>

  <ellipse cx="420" cy="540" rx="125" ry="27" class="uc-oval"/>
  <text x="420" y="540" class="uc-text">Simulate Traffic &amp; Closures</text>

  <ellipse cx="420" cy="615" rx="125" ry="27" class="uc-oval"/>
  <text x="420" y="615" class="uc-text">Control Live Auto-Simulator</text>

  <ellipse cx="420" cy="690" rx="125" ry="27" class="uc-oval"/>
  <text x="420" y="690" class="uc-text">Provision Users &amp; Verify</text>

  <!-- Column 2 (x=745) -->
  <ellipse cx="745" cy="145" rx="132" ry="27" class="uc-oval"/>
  <text x="745" y="145" class="uc-text">Auto-Rank &amp; Assign Unit</text>

  <ellipse cx="745" cy="230" rx="132" ry="27" class="uc-oval"/>
  <text x="745" y="230" class="uc-text">Follow Two-Leg Navigation</text>

  <ellipse cx="745" cy="310" rx="132" ry="27" class="uc-oval"/>
  <text x="745" y="310" class="uc-text">Update Mission Stage &amp; GPS</text>

  <ellipse cx="745" cy="425" rx="132" ry="27" class="uc-oval"/>
  <text x="745" y="425" class="uc-text">Update ICU &amp; Bed Capacity</text>

  <ellipse cx="745" cy="505" rx="132" ry="27" class="uc-oval"/>
  <text x="745" y="505" class="uc-text">Track Incoming Ambulances</text>

  <ellipse cx="745" cy="585" rx="132" ry="27" class="uc-oval"/>
  <text x="745" y="585" class="uc-text">Bulk Import Hospital CSV</text>

  <ellipse cx="745" cy="700" rx="132" ry="30" class="uc-oval"/>
  <text x="745" y="693" class="uc-text">Compute Shortest Path</text>
  <text x="745" y="709" class="uc-text">(KNN + A* / Dijkstra)</text>

  <!-- ==================== ASSOCIATIONS ==================== -->
  <!-- Citizen -->
  <line x1="130" y1="195" x2="295" y2="145" class="assoc"/>
  <line x1="130" y1="200" x2="295" y2="220" class="assoc"/>
  <line x1="130" y1="205" x2="295" y2="295" class="assoc"/>

  <!-- Dispatcher -->
  <line x1="130" y1="470" x2="295" y2="390" class="assoc"/>
  <line x1="130" y1="475" x2="295" y2="465" class="assoc"/>
  <line x1="130" y1="480" x2="295" y2="540" class="assoc"/>
  <line x1="130" y1="485" x2="295" y2="615" class="assoc"/>
  <line x1="130" y1="490" x2="295" y2="690" class="assoc"/>

  <!-- Ambulance Operator -->
  <line x1="1030" y1="215" x2="877" y2="230" class="assoc"/>
  <line x1="1030" y1="225" x2="877" y2="310" class="assoc"/>

  <!-- Hospital Staff -->
  <line x1="1030" y1="470" x2="877" y2="425" class="assoc"/>
  <line x1="1030" y1="480" x2="877" y2="505" class="assoc"/>
  <line x1="1030" y1="490" x2="877" y2="585" class="assoc"/>

  <!-- PostGIS & pgRouting Engine -->
  <line x1="1030" y1="685" x2="877" y2="700" class="assoc"/>
  <line x1="1030" y1="670" x2="877" y2="155" class="assoc"/>

  <!-- <<include>> Relationships -->
  <line x1="545" y1="145" x2="611" y2="145" class="inc"/>
  <text x="578" y="136" class="stereo">&lt;&lt;include&gt;&gt;</text>

  <line x1="545" y1="475" x2="655" y2="672" class="inc"/>
  <text x="572" y="585" class="stereo">&lt;&lt;include&gt;&gt;</text>
</svg>
